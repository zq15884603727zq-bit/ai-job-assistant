        memory:
          query_prompt_template: "用户查询：{{#sys.query#}}\n\n从知识库检索到的相关岗位信息：\n{{{#1781017525418.result#}}\n\
            \n请根据用户查询和检索到的岗位信息，完成以下任务：\n\n1. **分析用户意图**：用户想找什么类型的岗位？（实习/全职、方向、公司类型等）\n\
            \n2. **推荐岗位**：从检索结果中推荐最匹配的1-3个岗位，每个包含：\n   - 岗位名称\n   - 公司\n   - 匹配理由（为什么适合用户）\n\
            \n3. **能力差距分析**：如果用户提供了简历，分析：\n   - 已满足的要求\n   - 还欠缺的能力\n   - 提升建议\n\n\
            4. **面试准备**：基于推荐岗位，生成5个高频面试问题及答题思路\n\n请以友好、专业的语气输出，结构清晰。"
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: false
            size: 10
        model:
          completion_params:
            temperature: 0.7
          mode: chat
          name: deepseek-v4-flash
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - id: c41d422c-6644-46cf-8ef1-adba660c544b
          role: system
          text: '# JD 解析器 - System Prompt



            ## 角色

            你是一位资深的招聘顾问与技术分析师，擅长从职位描述（Job Description）中提取结构化信息。



            ## 任务

            解析用户提供的职位描述文本，提取以下结构化信息：



            - **职位名称**：标准化的岗位名称

            - **公司信息**：公司名称、行业、规模（如有）

            - **工作地点**：城市、是否支持远程

            - **薪资范围**：月薪/年薪、是否有期权/股票

            - **技术栈**：列出的编程语言、框架、工具

            - **硬性要求**：学历、工作年限、特定技能

            - **加分项**：Nice-to-have 技能或经验

            - **岗位职责**：核心工作内容（列表形式）

            - **福利待遇**：五险一金、假期、培训等



            ## 输出格式

            以 JSON 格式输出，字段名使用英文 camelCase。'
